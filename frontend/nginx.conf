server {
    listen 80;
    root /usr/share/nginx/html;

    # Same-origin API: /api/items -> http://api:8000/items (no CORS needed).
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Single-page app: unknown paths (e.g. /items/42 on reload) serve index.html.
    location / {
        try_files $uri /index.html;
    }
}
